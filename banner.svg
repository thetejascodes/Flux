<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Flux — One order. Seven services. Zero excuses." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1a1145"/>
      <stop offset="1" stop-color="#2b1055"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow1" cx="0.12" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="22" fill="url(#glow1)"/>
  <rect width="1200" height="340" rx="22" fill="url(#glow2)"/>

  <text x="600" y="132" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="108" font-weight="800" letter-spacing="14" fill="url(#title)">FLUX</text>
  <text x="600" y="176" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" letter-spacing="4" fill="#c7d2fe">ONE ORDER.  SEVEN SERVICES.  ZERO EXCUSES.</text>

  <!-- service chain -->
  <g stroke="#818cf8" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="5 6">
    <line x1="150" y1="262" x2="1050" y2="262"/>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <g transform="translate(150,262)"><rect x="-60" y="-19" width="120" height="38" rx="19" fill="#0f172a" stroke="#22d3ee"/><text y="5" fill="#a5f3fc">Gateway</text></g>
    <g transform="translate(300,262)"><rect x="-60" y="-19" width="120" height="38" rx="19" fill="#0f172a" stroke="#38bdf8"/><text y="5" fill="#bae6fd">Catalog</text></g>
    <g transform="translate(450,262)"><rect x="-60" y="-19" width="120" height="38" rx="19" fill="#0f172a" stroke="#818cf8"/><text y="5" fill="#c7d2fe">Order</text></g>
    <g transform="translate(600,262)"><rect x="-60" y="-19" width="120" height="38" rx="19" fill="#0f172a" stroke="#a78bfa"/><text y="5" fill="#ddd6fe">Inventory</text></g>
    <g transform="translate(750,262)"><rect x="-60" y="-19" width="120" height="38" rx="19" fill="#0f172a" stroke="#c084fc"/><text y="5" fill="#e9d5ff">Payment</text></g>
    <g transform="translate(900,262)"><rect x="-60" y="-19" width="120" height="38" rx="19" fill="#0f172a" stroke="#e879f9"/><text y="5" fill="#f5d0fe">Delivery</text></g>
    <g transform="translate(1050,262)"><rect x="-60" y="-19" width="120" height="38" rx="19" fill="#0f172a" stroke="#f472b6"/><text y="5" fill="#fbcfe8">Notification</text></g>
  </g>
  <text x="600" y="316" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" letter-spacing="2" fill="#94a3b8">EVENT-DRIVEN  ·  SAGA CHOREOGRAPHY  ·  DATABASE-PER-SERVICE  ·  FULLY TRACED</text>
</svg>