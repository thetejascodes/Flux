name: Order CI

on:
  push:
    paths:
      - "services/order/**"
      - ".github/workflows/order.yml"
  pull_request:
    paths:
      - "services/order/**"
      - ".github/workflows/order.yml"

defaults:
  run:
    working-directory: services/order

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: order_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORT: 4003
      DATABASE_URL: postgres://admin:admin@localhost:5432/order_db
      RABBITMQ_URL: amqp://localhost:5672
      CATALOG_SERVICE_URL: http://localhost:4001
      SERVICE_NAME: order

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/order/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run db:migrate

      - name: Run tests
        run: npm test